dataset_query:
  database: Test Starrocks Dev
  stages:
  - native: "WITH unified_data AS (\n    SELECT\n        `deals_1287967`.`owner_name` AS recruiter,\n        DATE(`deals_1287967`.`close_date`) AS date,\n        `deals_1287967`.`deal_stage` AS placement_type,\n        COUNT(DISTINCT `deals_1287967`.`id`) AS count,\n        'deals' AS source\n    FROM `deals_1287967` \n\t-- WHERE  `deals_1287967`.`deal_stage` IN ('Won', 'Candidate Started', 'Invoice Sent','Contract Completed','Renewal Agreed')\n    GROUP BY recruiter, date, placement_type\n\n    UNION ALL\n\n    SELECT\n        `jobs_1287967`.`owner_name` AS recruiter,\n        DATE(`jobs_1287967`.`created_on`) AS date,\n        `jobs_1287967`.`job_type_label` AS placement_type,\n        SUM(`jobs_1287967`.`no_of_openings`) AS count,\n        'jobs' AS source\n    FROM `jobs_1287967`\n    GROUP BY recruiter, date, placement_type\n)\nSELECT\n    recruiter,\n    date,\n    placement_type,\n    SUM(CASE WHEN source = 'deals' THEN count ELSE 0 END) AS total_deals,\n    SUM(CASE WHEN source = 'jobs' THEN count ELSE 0 END) AS total_jobs\nFROM unified_data\nGROUP BY recruiter, date, placement_type\nORDER BY recruiter, date, placement_type;\n"
    lib/type: mbql.stage/native
  lib/type: mbql/query
