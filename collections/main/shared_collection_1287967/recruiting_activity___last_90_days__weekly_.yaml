  stages:
  - native: SELECT week, metric, count FROM (SELECT DATE_FORMAT(created_on, '%Y-W%v') AS week, 'Jobs Created' AS metric, COUNT(*) AS count FROM jobs_1287967 WHERE created_on >= {{start_date}} AND created_on <= {{end_date}} GROUP BY week UNION ALL SELECT DATE_FORMAT(FROM_UNIXTIME(createdon), '%Y-W%v') AS week, 'Candidates Submitted' AS metric, COUNT(*) AS count FROM tblassignjobcandidate WHERE accountid = 1287967 AND is_deleted = 0 AND candidatestatusid = 1 AND FROM_UNIXTIME(createdon) >= {{start_date}} AND FROM_UNIXTIME(createdon) <= {{end_date}} GROUP BY week UNION ALL SELECT DATE_FORMAT(FROM_UNIXTIME(stagedate), '%Y-W%v') AS week, 'Interviews Conducted' AS metric, COUNT(*) AS count FROM tblassignjobcandidate WHERE accountid = 1287967 AND is_deleted = 0 AND candidatestatusid IN (34494701, 34494702, 34494703, 34494704) AND FROM_UNIXTIME(stagedate) >= {{start_date}} AND FROM_UNIXTIME(stagedate) <= {{end_date}} GROUP BY week UNION ALL SELECT DATE_FORMAT(FROM_UNIXTIME(stagedate), '%Y-W%v') AS week, 'Placements Made' AS metric, COUNT(*) AS count FROM tblassignjobcandidate WHERE accountid = 1287967 AND is_deleted = 0 AND candidatestatusid = 8 AND FROM_UNIXTIME(stagedate) >= {{start_date}} AND FROM_UNIXTIME(stagedate) <= {{end_date}} GROUP BY week) combined ORDER BY week, metric
